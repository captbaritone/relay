query moduleDirectiveOSSDefault_Query($id: ID!) {
  node(id: $id) {
    ...moduleDirectiveOSSDefault_Fragment @alias
  }
}

fragment moduleDirectiveOSSDefault_Fragment on User {
  id
  nameRenderer {
    ...moduleDirectiveOSSDefault_MarkdownUserNameRenderer_name
      @module(name: "./MarkdownUserNameRenderer.react")
  }
}

fragment moduleDirectiveOSSDefault_MarkdownUserNameRenderer_name on MarkdownUserNameRenderer {
  markdown
  data {
    markup
  }
}

%project_config%
{
  "language": "typescript"
}
