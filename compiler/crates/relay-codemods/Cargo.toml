[package]
name = "relay-codemods"
version = "0.0.0"
authors = ["Facebook"]
edition = "2021"
license = "MIT"

[dependencies]
common = { path = "../common" }
dashmap = { version = "5.4", features = ["rayon", "serde"] }
docblock-shared = { path = "../docblock-shared" }
errors = { path = "../errors" }
fnv = "1.0"
graphql-ir = { path = "../graphql-ir" }
graphql-ir-validations = { path = "../graphql-ir-validations" }
graphql-syntax = { path = "../graphql-syntax" }
graphql-text-printer = { path = "../graphql-text-printer" }
indexmap = { version = "1.9.2", features = ["arbitrary", "rayon", "serde-1"] }
intern = { path = "../intern" }
itertools = "0.11.0"
lazy_static = "1.4"
once_cell = "1.12"
parking_lot = { version = "0.12.1", features = ["send_guard"] }
regex = "1.9.2"
relay-config = { path = "../relay-config" }
rustc-hash = "1.1.0"
schema = { path = "../schema" }
thiserror = "1.0.43"
lsp-types = "0.94.1"